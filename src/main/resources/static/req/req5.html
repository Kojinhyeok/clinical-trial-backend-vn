<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trung Tâm Thử Nghiệm Lâm Sàng HUMAN</title>
    <link href="/css/main.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="/js/script.js"></script>
</head>
<body class="req5">
    <div id="head"></div>
    <div class="top_banner">
        <div class="container">
            <h1>Yêu Cầu Thử Nghiệm</h1>
        </div>
        <div class="scroll_down">
            <span class="scroll_text">Scroll to down</span>
            <div class="scroll_line_box"><div class="scroll_line_inner"></div></div>
        </div>
    </div>
    <div class="tab_menu">
        <div class="container">
            <div class="wrap">
                <a href="/req/req1.html">Quy Trình Thử Nghiệm</a>
                <a href="/req/req2.html">Tư Vấn Thử Nghiệm</a>
                <a href="/req/req3.html">Thông Báo</a>
                <a href="/req/req4.html">Câu Hỏi Thường Gặp (FAQ)</a>
                <a href="/req/req5.html" class="active">Tải Xuống</a>
            </div>
        </div>
    </div>
    <section class="sub1">
        <div class="container">
            <div class="title">
                <div class="top">
                    <img src="/images/icon/symbol.svg" alt="" class="symbol">
                    <h2>Tải Xuống</h2>
                </div>
            </div>
            <div class="content">
                <div class="bd_search">
                    <div class="select" id="search_field_wrapper">
                        <button class="toggle" aria-haspopup="listbox" aria-expanded="false">Tiêu đề<span class="icon"><img src="/images/icon/dropdown.svg" alt=""></span>
                        </button>
                        <ul class="option" role="listbox" hidden>
                            <li role="option" data-value="subject" class="active">Tiêu đề</li>
                            <li role="option" data-value="content">Nội dung</li>
                        </ul>
                    </div>
                    <input type="hidden" id="search_field" value="subject">
                    <div class="search_input">
                        <input type="text" id="search_keyword" placeholder="Nhập từ khóa tìm kiếm.">
                        <button id="search_btn"><img src="/images/icon/search.svg" alt=""></button>
                    </div>
                </div>
                <table class="table1">
                    <thead>
                        <tr>
                            <td class="num">STT</td>
                            <td class="tit">Tiêu đề</td>
                            <td class="name">Người đăng</td>
                            <td class="date">Ngày đăng</td>
                            <td class="view">Lượt xem</td>
                            <td class="file">Tệp <span class="pc_only">đính kèm</span></td>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- JavaScript로 동적 생성 -->
                    </tbody>
                </table>
                <div class="pagination">
                    <!-- JavaScript로 동적 생성 -->
                </div>
            </div>
        </div>
    </section>
    <div id="foot"></div>
    <script>
        let currentPage = 1;
        const itemsPerPage = 10;
        let allFiles = [];

        $(function(){
            $("#head").load("/head.html");
            $("#foot").load("/foot.html");

            loadFiles();

            $('#search_btn').click(function() {
                searchFiles();
            });

            $('#search_keyword').keypress(function(e) {
                if (e.which === 13) {
                    searchFiles();
                }
            });

            $(document).on('click', '.toggle', function () {
                const $wrapper = $(this).closest('.select');
                const $options = $wrapper.find('.option');
                const isOpen = !$options.prop('hidden');

                $('.option').attr('hidden', true);
                $('.select').removeClass('open');

                if (!isOpen) {
                    $options.removeAttr('hidden');
                    $wrapper.addClass('open');
                }
            });

            $(document).on('click', '.option li', function () {
                const $this = $(this);
                const value = $this.data('value');
                const label = $this.text();
                const $wrapper = $this.closest('.select');

                $this.addClass('active').siblings().removeClass('active');
                $wrapper.find('.toggle').contents().first()[0].textContent = label + ' ';
                $('#search_field').val(value);
                $this.parent().attr('hidden', true);
                $wrapper.removeClass('open');
            });

            $(document).on('click', function (e) {
                if (!$(e.target).closest('.select').length) {
                    $('.option').attr('hidden', true);
                    $('.select').removeClass('open');
                }
            });
        });

        function loadFiles() {
            $.ajax({
                url: '/api/trial-files',
                method: 'GET',
                success: function(data) {
                    allFiles = data;
                    currentPage = 1;
                    renderFiles();
                    renderPagination();
                },
                error: function(error) {
                    console.error('Lỗi tải dữ liệu:', error);
                    alert('Không thể tải dữ liệu.');
                }
            });
        }

        function searchFiles() {
            const searchType = $('#search_field').val();
            const keyword = $('#search_keyword').val().trim();

            if (!keyword) {
                loadFiles();
                return;
            }

            $.ajax({
                url: '/api/trial-files/search',
                method: 'GET',
                data: {
                    field: searchType,
                    keyword: keyword
                },
                success: function(data) {
                    if (data.length === 0) {
                        alert('Không có kết quả tìm kiếm.');
                        return;
                    }
                    allFiles = data;
                    currentPage = 1;
                    renderFiles();
                    renderPagination();
                },
                error: function(error) {
                    console.error('Lỗi tìm kiếm:', error);
                    alert('Tìm kiếm thất bại.');
                }
            });
        }

        function renderFiles() {
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageFiles = allFiles.slice(startIndex, endIndex);

            let html = '';

            if (pageFiles.length === 0) {
                html = '<tr><td colspan="6" style="text-align: center; padding: 40px;">Chưa có tài liệu nào.</td></tr>';
            } else {
                const noticeCount = allFiles.filter(f => f.isNotification).length;

                pageFiles.forEach((file, index) => {
                    const globalIndex = startIndex + index;
                    let num;

                    if (file.isNotification) {
                        num = '<td class="num notice">[Thông báo]</td>';
                    } else {
                        const actualNumber = allFiles.length - noticeCount - (globalIndex - noticeCount);
                        num = '<td class="num">' + String(actualNumber).padStart(2, '0') + '</td>';
                    }

                    const date = formatDate(file.createdAt);
                    const hasFile = file.attachedFiles && file.attachedFiles.length > 0;
                    const fileIcon = hasFile ? '<img src="/images/icon/file.svg" alt="">' : '';

                    html += `
                        <tr>
                            ${num}
                            <td class="tit"><a href="/req/req5_detail.html?id=${file.id}">${file.title}</a></td>
                            <td class="name">${file.userName || 'Quản trị viên'}</td>
                            <td class="date">${date}</td>
                            <td class="view">${file.view || 0}</td>
                            <td class="file">${fileIcon}</td>
                        </tr>
                    `;
                });
            }

            $('table.table1 tbody').html(html);
        }

        function renderPagination() {
            const totalPages = Math.ceil(allFiles.length / itemsPerPage);

            if (totalPages <= 1) {
                $('.pagination').html('');
                return;
            }

            let html = '';

            if (currentPage > 1) {
                html += '<button class="prev" onclick="changePage(' + (currentPage - 1) + ')"><img src="/images/icon/prev.svg" alt="">Trước</button>';
            } else {
                html += '<button class="prev" disabled><img src="/images/icon/prev.svg" alt="">Trước</button>';
            }

            html += '<div class="num">';
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    html += '<button class="active">' + i + '</button>';
                } else {
                    html += '<button onclick="changePage(' + i + ')">' + i + '</button>';
                }
            }
            html += '</div>';

            if (currentPage < totalPages) {
                html += '<button class="next" onclick="changePage(' + (currentPage + 1) + ')">Sau<img src="/images/icon/next.svg" alt=""></button>';
            } else {
                html += '<button class="next" disabled>Sau<img src="/images/icon/next.svg" alt=""></button>';
            }

            $('.pagination').html(html);
        }

        function changePage(page) {
            currentPage = page;
            renderFiles();
            renderPagination();
            $('html, body').animate({ scrollTop: 0 }, 300);
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const year = String(date.getFullYear()).slice(2);
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return year + '.' + month + '.' + day;
        }
    </script>
</body>
</html>
