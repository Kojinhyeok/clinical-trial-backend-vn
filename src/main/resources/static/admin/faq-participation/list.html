<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link rel="shortcut icon" href="../img/icons/icon-48x48.png" />

	<title>FAQ 관리 - Human Clinical 관리자</title>

	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body data-page="faq-participation-list" data-base="../">
	<div class="wrapper">

		<div id="sidebar-container"></div>

		<div class="main">
			<div id="header-container"></div>

			<main class="content">
				<div class="container-fluid p-0">

					<div class="d-flex justify-content-between align-items-center mb-3">
						<h1 class="h3 mb-0"><strong>FAQ 관리</strong></h1>
						<a href="detail" class="btn btn-primary">
							<i class="align-middle" data-feather="plus"></i>
							<span class="align-middle ms-1">FAQ 등록</span>
						</a>
					</div>

					<!-- 검색 필터 -->
					<div id="searchFilterContainer"></div>

					<!-- FAQ 목록 -->
					<div class="card">
						<div class="card-header">
							<h5 class="card-title mb-0">FAQ 목록</h5>
						</div>
						<table class="table table-hover my-0" id="faqTable">
							<thead>
								<tr>
									<th style="width:80px;">순서</th>
									<th>질문</th>
									<th class="d-none d-md-table-cell">답변</th>
									<th class="d-none d-md-table-cell" style="width:120px;">등록일</th>
								</tr>
							</thead>
							<tbody>
							</tbody>
						</table>
						<div class="card-footer d-flex justify-content-between align-items-center">
							<span class="text-muted small" id="pageInfo"></span>
							<nav><ul class="pagination pagination-sm mb-0" id="pageNav"></ul></nav>
						</div>
					</div>

				</div>
			</main>

			<footer class="footer">
				<div class="container-fluid">
					<div class="row text-muted">
						<div class="col-12 text-start">
							<p class="mb-0">&copy; Human Clinical</p>
						</div>
					</div>
				</div>
			</footer>
		</div>
	</div>

	<script src="../js/app.js"></script>
	<script src="../js/pagination.js"></script>
	<script src="../js/search-filter.js"></script>
	<script src="../js/common.js"></script>
	<script src="../js/admin-utils.js"></script>
	<script>
		function escapeHtml(str) {
			if (!str) return "";
			var div = document.createElement("div");
			div.textContent = str;
			return div.innerHTML;
		}

		function loadFaqs() {
			fetch("/api/faqs/participation")
				.then(function (res) {
					if (!res.ok) throw new Error("API 오류: " + res.status);
					return res.json();
				})
				.then(function (list) {
					renderRows(Array.isArray(list) ? list : []);
				})
				.catch(function (err) {
					console.error("FAQ 목록 로딩 실패:", err);
					document.querySelector("#faqTable tbody").innerHTML =
						'<tr><td colspan="4" class="text-center text-muted py-4">데이터를 불러올 수 없습니다.</td></tr>';
				});
		}

		function renderRows(items) {
			var tbody = document.querySelector("#faqTable tbody");
			tbody.innerHTML = "";

			if (items.length === 0) {
				tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">등록된 FAQ가 없습니다.</td></tr>';
				initSearchAndPagination();
				return;
			}

			items.forEach(function (f) {
				var tr = document.createElement("tr");
				tr.style.cursor = "pointer";
				tr.setAttribute("data-keyword", (f.title || "") + " " + (f.content || ""));
				tr.addEventListener("click", function () {
					location.href = "detail?id=" + f.id;
				});

				tr.innerHTML =
					'<td>' + (f.displayOrder || 0) + '</td>' +
					'<td>' + escapeHtml(f.title || "") + '</td>' +
					'<td class="d-none d-md-table-cell text-truncate" style="max-width:300px;">' + escapeHtml(f.content || "") + '</td>' +
					'<td class="d-none d-md-table-cell">' + AdminUtils.formatDate(f.createdAt) + '</td>';

				tbody.appendChild(tr);
			});

			initSearchAndPagination();
		}

		var searchFilterInited = false;
		function initSearchAndPagination() {
			if (!searchFilterInited) {
				initSearchFilter({
					containerId: "searchFilterContainer",
					tableId: "faqTable",
					pagination: { perPage: 10, infoId: "pageInfo", navId: "pageNav" },
					fields: [
						{ type: "text", id: "searchKeyword", label: "질문/답변 검색", placeholder: "키워드 검색", colClass: "col-md-4", dataKey: "keyword" }
					]
				});
				searchFilterInited = true;
			} else {
				if (typeof initPagination === "function") {
					initPagination({ tableId: "faqTable", perPage: 10, infoId: "pageInfo", navId: "pageNav" });
				}
			}
		}

		document.addEventListener("DOMContentLoaded", function () {
			loadFaqs();
		});
	</script>
</body>

</html>
