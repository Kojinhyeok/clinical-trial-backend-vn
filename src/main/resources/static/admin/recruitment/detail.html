	<script src="../js/admin-utils.js"></script>
	<script>
		var FIELD_MAP = {};
		var ENTITY_TYPE = "RECRUITMENT";
		var editorMgr = AdminUtils.createEditorManager("editor", ENTITY_TYPE);
		var currentData = null;
		var currentSchedules = [];

		// 선택된 날짜 목록: { "2026-03-01": true, ... }
		var selectedDates = {};
		var calYear, calMonth;

		// 상세 이미지 상태
		var detailImageFileId = null;  // 현재 서버에 저장된 파일 ID
		var detailImageRemoved = false; // 삭제 여부

		function loadFields() {
			return fetch("/api/recruitment-fields")
				.then(function (res) { return res.ok ? res.json() : []; })
				.then(function (fields) {
					(fields || []).forEach(function (f) { FIELD_MAP[String(f.id)] = f.fieldName; });
					renderFieldCheckboxes(fields || []);
				});
		}

		function renderFieldCheckboxes(fields) {
			var container = document.getElementById("inputFieldGroup");
			container.innerHTML = "";
			fields.forEach(function (f) {
				var div = document.createElement("div");
				div.className = "form-check";
				div.innerHTML = '<input class="form-check-input" type="checkbox" value="' + f.id + '" id="field' + f.id + '">' +
					'<label class="form-check-label" for="field' + f.id + '">' + f.fieldName + '</label>';
				container.appendChild(div);
			});
			container.querySelectorAll("input[type=checkbox]").forEach(function (cb) {
				cb.addEventListener("change", function () {
					if (document.getElementById("recruitmentId").value && cb.checked) {
						container.querySelectorAll("input[type=checkbox]").forEach(function (other) {
							if (other !== cb) other.checked = false;
						});
					}
					updateFieldSelectionUI();
				});
			});
		}

		function getSelectedFieldCount() {
			return document.querySelectorAll("#inputFieldGroup input[type=checkbox]:checked").length;
		}

		function updateFieldSelectionUI() {
			var count = getSelectedFieldCount();
			var isMulti = count >= 2;
			var isNew = !document.getElementById("recruitmentId").value;
			var scheduleSection = document.getElementById("scheduleSection");
			var bulkInfo = document.getElementById("bulkInfoMessage");
			var btnLabel = document.getElementById("btnSaveLabel");

			if (isMulti && isNew) {
				scheduleSection.style.display = "none";
				bulkInfo.style.display = "";
				btnLabel.textContent = "일괄 게시 (" + count + "건)";
			} else {
				scheduleSection.style.display = "";
				bulkInfo.style.display = "none";
				btnLabel.textContent = "게시";
			}
		}

		function parseFieldIds(jsonStr) {
			if (!jsonStr) return [];
			try { return JSON.parse(jsonStr); } catch (e) { return []; }
		}

		function fieldIdsToNames(jsonStr) {
			var ids = parseFieldIds(jsonStr);
			return ids.map(function (id) { return FIELD_MAP[String(id)] || id; }).join(", ");
		}

		function formatDateStr(dateStr) {
			if (!dateStr) return "";
			var d = new Date(dateStr);
			var days = ["일", "월", "화", "수", "목", "금", "토"];
			return dateStr + " (" + days[d.getDay()] + ")";
		}

		// ========== 캘린더 ==========
		function initCalendar() {
			var now = new Date();
			calYear = now.getFullYear();
			calMonth = now.getMonth();
			renderCalendar();

			document.getElementById("btnPrevMonth").addEventListener("click", function () {
				calMonth--;
				if (calMonth < 0) { calMonth = 11; calYear--; }
				renderCalendar();
			});
			document.getElementById("btnNextMonth").addEventListener("click", function () {
				calMonth++;
				if (calMonth > 11) { calMonth = 0; calYear++; }
				renderCalendar();
			});
		}

		function renderCalendar() {
			var months = ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"];
			document.getElementById("calendarTitle").textContent = calYear + "년 " + months[calMonth];

			var tbody = document.getElementById("calendarBody");
			tbody.innerHTML = "";

			var firstDay = new Date(calYear, calMonth, 1).getDay();
			var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
			var today = new Date();
			var todayStr = today.getFullYear() + "-" + ("0" + (today.getMonth() + 1)).slice(-2) + "-" + ("0" + today.getDate()).slice(-2);

			var day = 1;
			for (var row = 0; row < 6; row++) {
				if (day > daysInMonth) break;
				var tr = document.createElement("tr");
				for (var col = 0; col < 7; col++) {
					var td = document.createElement("td");
					if ((row === 0 && col < firstDay) || day > daysInMonth) {
						td.className = "empty";
						td.innerHTML = "&nbsp;";
					} else {
						var dateStr = calYear + "-" + ("0" + (calMonth + 1)).slice(-2) + "-" + ("0" + day).slice(-2);
						td.textContent = day;
						td.setAttribute("data-date", dateStr);
						if (selectedDates[dateStr]) td.classList.add("selected");
						if (dateStr === todayStr) td.classList.add("today");
						td.addEventListener("click", onCalendarDateClick);
						day++;
					}
					tr.appendChild(td);
				}
				tbody.appendChild(tr);
			}
		}

		function onCalendarDateClick(e) {
			var dateStr = e.target.getAttribute("data-date");
			if (!dateStr) return;
			if (selectedDates[dateStr]) {
				delete selectedDates[dateStr];
				e.target.classList.remove("selected");
			} else {
				selectedDates[dateStr] = true;
				e.target.classList.add("selected");
			}
			renderDateCards();
			syncDatesFromSelection();
		}

		function syncDatesFromSelection() {
			var dates = Object.keys(selectedDates).sort();
			if (dates.length > 0) {
				document.getElementById("inputStartDate").value = dates[0];
				document.getElementById("inputEndDate").value = dates[dates.length - 1];
			} else {
				document.getElementById("inputStartDate").value = "";
				document.getElementById("inputEndDate").value = "";
			}
		}

		function renderDateCards() {
			var container = document.getElementById("selectedDateCards");
			container.innerHTML = "";
			var dates = Object.keys(selectedDates).sort();

			if (dates.length === 0) return;

			var wrap = document.createElement("div");
			wrap.className = "d-flex flex-wrap gap-2 mt-2";

			dates.forEach(function (dateStr) {
				var badge = document.createElement("span");
				badge.className = "badge bg-primary d-flex align-items-center gap-1";
				badge.style.fontSize = "13px";
				badge.innerHTML =
					formatDateStr(dateStr) +
					'<button type="button" class="btn-close btn-close-white btn-remove-date" data-date="' + dateStr + '" style="font-size:9px;" aria-label="제거"></button>';
				wrap.appendChild(badge);
			});

			container.appendChild(wrap);

			container.querySelectorAll(".btn-remove-date").forEach(function (btn) {
				btn.addEventListener("click", function () {
					var d = this.getAttribute("data-date");
					delete selectedDates[d];
					renderDateCards();
					syncDatesFromSelection();
					renderCalendar();
				});
			});
		}

		// ========== 스케줄 데이터 변환 (날짜만) ==========
		function buildSchedulePayload() {
			return Object.keys(selectedDates).sort().map(function (dateStr) {
				return { scheduleDate: dateStr };
			});
		}

		function populateSelectedDatesFromSchedules(schedules) {
			selectedDates = {};
			if (!schedules || !schedules.length) return;
			schedules.forEach(function (sch) {
				selectedDates[sch.scheduleDate] = true;
			});
		}

		// ========== 상세 이미지 ==========
		function uploadDetailImage(file, entityId) {
			return fetch("/api/files/upload-link", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({
					entityType: "RECRUITMENT",
					entityId: entityId,
					fileCategory: "ATTACHMENT",
					originalFilename: file.name,
					mimeType: file.type,
					fileSize: file.size
				})
			})
			.then(function (res) {
				if (!res.ok) throw new Error("upload-link 실패");
				return res.json();
			})
			.then(function (data) {
				return fetch(data.uploadUrl, {
					method: "PUT",
					headers: { "Content-Type": file.type },
					body: file
				}).then(function () { return data.id; });
			});
		}

		function loadDetailImage(entityId) {
			return fetch("/api/files/list?entityType=RECRUITMENT&entityId=" + entityId)
				.then(function (res) { return res.ok ? res.json() : []; })
				.then(function (files) {
					var attachments = (files || []).filter(function (f) {
						return f.fileCategory === "ATTACHMENT";
					});
					return attachments.length > 0 ? attachments[0] : null;
				});
		}

		function showDetailImagePreview(src, fileId) {
			detailImageFileId = fileId || null;
			document.getElementById("detailImagePreview").src = src;
			document.getElementById("detailImagePreviewWrap").style.display = "";
			document.getElementById("inputDetailImage").style.display = "none";
		}

		function clearDetailImagePreview() {
			detailImageFileId = null;
			detailImageRemoved = true;
			document.getElementById("detailImagePreview").src = "";
			document.getElementById("detailImagePreviewWrap").style.display = "none";
			document.getElementById("inputDetailImage").style.display = "";
			document.getElementById("inputDetailImage").value = "";
		}

		// ========== 메인 로직 ==========
		document.addEventListener("DOMContentLoaded", function () {
			var params = new URLSearchParams(window.location.search);
			var id = params.get("id");

			AdminUtils.bindTitleErrorClear();

			document.getElementById("inputParticipationCost").addEventListener("keydown", function (e) {
				var allowed = ["Backspace", "Delete", "ArrowLeft", "ArrowRight", "Tab"];
				if (allowed.indexOf(e.key) === -1 && !/^[0-9]$/.test(e.key)) {
					e.preventDefault();
				}
				if (e.key === "Backspace" || e.key === "Delete") {
					var raw = this.value.replace(/[^0-9]/g, "");
					raw = raw.slice(0, -1);
					this.value = raw ? parseInt(raw).toLocaleString("ko-KR") + "원" : "";
					e.preventDefault();
				}
			});

			document.getElementById("inputParticipationCost").addEventListener("input", function () {
				var raw = this.value.replace(/[^0-9]/g, "");
				if (!raw) { this.value = ""; return; }
				this.value = parseInt(raw).toLocaleString("ko-KR") + "원";
			});

			document.getElementById("inputParticipationCost").addEventListener("blur", function () {
				var raw = this.value.replace(/[^0-9]/g, "");
				if (!raw) { this.value = ""; return; }
				this.value = parseInt(raw).toLocaleString("ko-KR") + "원";
			});

			// 상세 이미지 파일 선택
			document.getElementById("inputDetailImage").addEventListener("change", function () {
				var file = this.files[0];
				if (!file) return;
				var reader = new FileReader();
				reader.onload = function (e) {
					document.getElementById("detailImagePreview").src = e.target.result;
					document.getElementById("detailImagePreviewWrap").style.display = "";
					document.getElementById("inputDetailImage").style.display = "none";
				};
				reader.readAsDataURL(file);
				detailImageRemoved = false;
			});

			// 상세 이미지 삭제
			document.getElementById("btnRemoveDetailImage").addEventListener("click", function () {
				clearDetailImagePreview();
			});

			initCalendar();

			loadFields().then(function () {
				if (id) {
					loadDetail(id);
				} else {
					showCreateMode();
				}
			});

			// ========== 데이터 로딩 ==========
			function loadDetail(recId) {
				Promise.all([
					fetch("/api/recruitments/" + recId).then(function (r) { return r.ok ? r.json() : null; }),
					fetch("/api/recruitment-schedules/recruitment/" + recId).then(function (r) { return r.ok ? r.json() : []; }),
					loadDetailImage(recId)
				])
				.then(function (results) {
					var data = results[0];
					var schedules = Array.isArray(results[1]) ? results[1] : [];
					var imageFile = results[2];

					if (!data) throw new Error("데이터 없음");
					currentData = data;
					currentSchedules = schedules;
					showViewMode(data, schedules, imageFile);
				})
				.catch(function (err) {
					console.error(err);
					alert("모집 공고를 찾을 수 없습니다.");
					location.href = "list";
				});
			}

			// ========== 상세 보기 모드 ==========
			function showViewMode(data, schedules, imageFile) {
				document.getElementById("pageTitle").textContent = "모집 공고 상세";
				document.getElementById("viewMode").style.display = "";
				document.getElementById("editMode").style.display = "none";

				document.getElementById("viewTitle").textContent = data.title;
				document.getElementById("viewCreatedAt").textContent = AdminUtils.formatDate(data.createdAt);
				document.getElementById("viewUpdatedAt").textContent = AdminUtils.formatDate(data.updatedAt);
				document.getElementById("viewContent").innerHTML = data.content;

				if (data.isNotification) {
					document.getElementById("viewNotice").innerHTML = '<span class="badge bg-danger">공지</span>';
				} else {
					document.getElementById("viewNotice").innerHTML = '<span class="badge bg-secondary">일반</span>';
				}

				if (data.isTemp) {
					document.getElementById("viewStatus").innerHTML = '<span class="badge bg-warning text-dark">임시저장</span>';
				} else if (data.status === "OPEN") {
					document.getElementById("viewStatus").innerHTML = '<span class="badge bg-success">모집중</span>';
				} else if (data.status === "ALWAYS") {
					document.getElementById("viewStatus").innerHTML = '<span class="badge bg-info">상시모집</span>';
				} else {
					document.getElementById("viewStatus").innerHTML = '<span class="badge bg-secondary">마감</span>';
				}

				document.getElementById("viewTrialCode").textContent = data.trialCode || "-";
				document.getElementById("viewTrialName").textContent = data.trialName || "-";
				document.getElementById("viewParticipationNumber").textContent = data.participationNumber ? data.participationNumber + "명" : "-";
				var appLink = document.getElementById("viewApplicationLink");
				appLink.href = "../trial-application/list.html?recruitment_id=" + data.id;
				appLink.style.display = "";
				fetch("/api/trial-applications/recruitment/" + data.id)
					.then(function (res) { return res.ok ? res.json() : []; })
					.then(function (apps) {
						document.getElementById("viewApplicationLabel").textContent = "신청자 목록 (" + (apps ? apps.length : 0) + ")";
					});
				var rawViewCost = (data.participationCost || "").replace(/[^0-9]/g, "");
				document.getElementById("viewParticipationCost").textContent = rawViewCost ? parseInt(rawViewCost).toLocaleString("ko-KR") + "원" : "-";
				document.getElementById("viewParticipationGroup").textContent = data.participationGroup || "-";
				document.getElementById("viewTrialPart").textContent = data.trialPart || "-";
				document.getElementById("viewStartDate").textContent = data.startDate || "-";
				document.getElementById("viewEndDate").textContent = data.endDate || "-";
				document.getElementById("viewRequirements").textContent = data.requirements || "-";
				document.getElementById("viewField").textContent = fieldIdsToNames(data.recruitmentFieldIds) || "-";

				renderViewSchedule(schedules);

				// 상세 이미지
				if (imageFile && imageFile.s3Url) {
					document.getElementById("viewDetailImageSection").style.display = "";
					document.getElementById("viewDetailImageLink").href = "/api/files/" + imageFile.id + "/view";
				} else {
					document.getElementById("viewDetailImageSection").style.display = "none";
				}

				if (window.feather) feather.replace();
			}

			// ========== 일정 현황 렌더링 (날짜 배지) ==========
			function renderViewSchedule(schedules) {
				var container = document.getElementById("viewScheduleContainer");
				if (!schedules || schedules.length === 0) {
					container.innerHTML = '<span class="text-muted">설정된 일정이 없습니다.</span>';
					return;
				}
				var html = '<div class="d-flex flex-wrap gap-2">';
				schedules.forEach(function (sch) {
					html += '<span class="badge bg-primary" style="font-size:13px;">' + formatDateStr(sch.scheduleDate) + '</span>';
				});
				html += '</div>';
				container.innerHTML = html;
			}

			// ========== 등록 모드 ==========
			function showCreateMode() {
				document.getElementById("pageTitle").textContent = "모집 공고 등록";
				document.getElementById("viewMode").style.display = "none";
				document.getElementById("editMode").style.display = "";
				document.getElementById("btnDeleteEdit").style.display = "none";
				document.getElementById("fieldSelectionHint").textContent = "(복수 선택 가능)";
				document.querySelectorAll("#inputFieldGroup input[type=checkbox]").forEach(function (cb) {
					cb.disabled = false;
				});
				selectedDates = {};
				renderDateCards();
				editorMgr.init("");
				clearDetailImagePreview();
			}

			// ========== 수정 모드 ==========
			function showEditMode(data, schedules) {
				document.getElementById("pageTitle").textContent = "모집 공고 수정";
				document.getElementById("viewMode").style.display = "none";
				document.getElementById("editMode").style.display = "";
				document.getElementById("btnDeleteEdit").style.display = "";
				document.getElementById("fieldSelectionHint").textContent = "(변경 불가)";

				document.getElementById("recruitmentId").value = data.id;
				document.getElementById("inputTitle").value = data.title || "";
				document.getElementById("inputNotice").checked = !!data.isNotification;
				document.getElementById("inputTrialCode").value = data.trialCode || "";
				document.getElementById("inputTrialName").value = data.trialName || "";
				document.getElementById("inputParticipationNumber").value = data.participationNumber || "";
				var rawCost = (data.participationCost || "").replace(/[^0-9]/g, "");
				document.getElementById("inputParticipationCost").value = rawCost ? parseInt(rawCost).toLocaleString("ko-KR") + "원" : "";
				document.getElementById("inputParticipationGroup").value = data.participationGroup || "";
				document.getElementById("inputTrialPart").value = data.trialPart || "";
				document.getElementById("inputStartDate").value = data.startDate || "";
				document.getElementById("inputEndDate").value = data.endDate || "";
				document.getElementById("inputRequirements").value = data.requirements || "";
				document.getElementById("inputStatus").value = data.status || "OPEN";

				editorMgr.init(data.content || "");

				var fieldIds = parseFieldIds(data.recruitmentFieldIds);
				document.querySelectorAll("#inputFieldGroup input[type=checkbox]").forEach(function (cb) {
					cb.checked = fieldIds.indexOf(parseInt(cb.value)) !== -1;
					cb.disabled = true;
				});

				populateSelectedDatesFromSchedules(schedules);
				var sortedDates = Object.keys(selectedDates).sort();
				if (sortedDates.length > 0) {
					var firstDate = new Date(sortedDates[0]);
					calYear = firstDate.getFullYear();
					calMonth = firstDate.getMonth();
				}
				renderCalendar();
				renderDateCards();

				// 상세 이미지 로드
				detailImageRemoved = false;
				clearDetailImagePreview();
				loadDetailImage(data.id).then(function (imageFile) {
					if (imageFile && imageFile.s3Url) {
						showDetailImagePreview(imageFile.s3Url, imageFile.id);
					}
				});

				if (window.feather) feather.replace();
			}

			// ========== 수정 버튼 ==========
			document.getElementById("btnEditMode").addEventListener("click", function () {
				if (currentData) showEditMode(currentData, currentSchedules);
			});

			// ========== 유효성 검사 ==========
			function validate() {
				return AdminUtils.validateTitleAndContent(editorMgr);
			}

			document.getElementById("inputTitle").addEventListener("input", function () { this.classList.remove("is-invalid"); });

			// ========== 폼 데이터 수집 ==========
			function collectFormData(isTemp) {
				var selectedFieldIds = [];
				document.querySelectorAll("#inputFieldGroup input[type=checkbox]:checked").forEach(function (cb) {
					selectedFieldIds.push(parseInt(cb.value));
				});

				return {
					title: document.getElementById("inputTitle").value.trim(),
					isNotification: document.getElementById("inputNotice").checked,
					isTemp: isTemp,
					trialCode: document.getElementById("inputTrialCode").value.trim(),
					trialName: document.getElementById("inputTrialName").value.trim(),
					participationNumber: parseInt(document.getElementById("inputParticipationNumber").value) || null,
					participationCost: document.getElementById("inputParticipationCost").value.trim(),
					participationGroup: document.getElementById("inputParticipationGroup").value.trim(),
					trialPart: document.getElementById("inputTrialPart").value.trim(),
					recruitmentFieldIds: JSON.stringify(selectedFieldIds),
					startDate: document.getElementById("inputStartDate").value || null,
					endDate: document.getElementById("inputEndDate").value || null,
					status: document.getElementById("inputStatus").value,
					requirements: document.getElementById("inputRequirements").value.trim(),
					content: editorMgr.getData(),
					userId: null
				};
			}

			// ========== 저장 처리 ==========
			function doSave(isTemp) {
				var recId = document.getElementById("recruitmentId").value;
				var body = collectFormData(isTemp);
				var isMultiBulk = !recId && getSelectedFieldCount() >= 2;

				var btnSave = document.getElementById("btnSave");
				var btnTemp = document.getElementById("btnSaveTemp");
				btnSave.disabled = true;
				btnTemp.disabled = true;

				if (isMultiBulk) {
					fetch("/api/recruitments/bulk", {
						method: "POST",
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify(body)
					})
					.then(function (res) {
						if (!res.ok) throw new Error("저장 실패: " + res.status);
						return res.json();
					})
					.then(function (savedList) {
						alert(savedList.length + "개 공고가 생성되었습니다.\n각 공고에서 일정을 개별 설정해주세요.");
						location.href = "list";
					})
					.catch(function (err) {
						alert("저장 중 오류가 발생했습니다.\n" + err.message);
					})
					.finally(function () {
						btnSave.disabled = false;
						btnTemp.disabled = false;
					});
				} else {
					var url, method;
					if (recId) {
						url = "/api/recruitments/" + recId;
						method = "PUT";
					} else {
						url = "/api/recruitments";
						method = "POST";
					}

					var savedId;
					fetch(url, {
						method: method,
						headers: { "Content-Type": "application/json" },
						body: JSON.stringify(body)
					})
					.then(function (res) {
						if (!res.ok) throw new Error("저장 실패: " + res.status);
						return res.json();
					})
					.then(function (saved) {
						savedId = saved.id;

						var tasks = [];

						// 스케줄 저장
						var schedulePayload = buildSchedulePayload();
						if (schedulePayload.length > 0) {
							tasks.push(
								fetch("/api/recruitment-schedules/recruitment/" + savedId, {
									method: "POST",
									headers: { "Content-Type": "application/json" },
									body: JSON.stringify(schedulePayload)
								})
							);
						}

						// 기존 이미지 삭제
						if (detailImageRemoved && detailImageFileId) {
							tasks.push(fetch("/api/files/" + detailImageFileId, { method: "DELETE" }));
							detailImageFileId = null;
						}

						// 새 이미지 업로드
						var imageInput = document.getElementById("inputDetailImage");
						if (imageInput.files && imageInput.files[0]) {
							tasks.push(uploadDetailImage(imageInput.files[0], savedId));
						}

						return Promise.all(tasks);
					})
					.then(function () {
						location.href = "list";
					})
					.catch(function (err) {
						alert("저장 중 오류가 발생했습니다.\n" + err.message);
					})
					.finally(function () {
						btnSave.disabled = false;
						btnTemp.disabled = false;
					});
				}
			}

			// 게시 저장
			document.getElementById("btnSave").addEventListener("click", function () {
				if (!validate()) return;
				doSave(false);
			});

			// 임시 저장
			document.getElementById("btnSaveTemp").addEventListener("click", function () {
				var titleInput = document.getElementById("inputTitle");
				if (!titleInput.value.trim()) {
					titleInput.classList.add("is-invalid");
					return;
				}
				doSave(true);
			});

			// ========== 삭제 ==========
			document.getElementById("btnConfirmDelete").addEventListener("click", function () {
				if (!id) return;
				fetch("/api/recruitments/" + id, { method: "DELETE" })
					.then(function (res) {
						if (!res.ok) throw new Error("삭제 실패: " + res.status);
						location.href = "list";
					})
					.catch(function (err) {
						alert("삭제 중 오류가 발생했습니다.\n" + err.message);
					});
			});
		});
	</script>
</body>

</html>
