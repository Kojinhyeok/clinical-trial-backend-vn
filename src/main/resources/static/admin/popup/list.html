<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link rel="shortcut icon" href="../img/icons/icon-48x48.png" />

	<title>팝업 관리 - Human Clinical 관리자</title>

	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body data-page="popup" data-base="../">
	<div class="wrapper">

		<div id="sidebar-container"></div>

		<div class="main">
			<div id="header-container"></div>

			<main class="content">
				<div class="container-fluid p-0">

					<div class="d-flex justify-content-between align-items-center mb-3">
						<h1 class="h3 mb-0"><strong>팝업 관리</strong></h1>
						<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">
							<i class="align-middle" data-feather="plus"></i>
							<span class="align-middle ms-1">팝업 등록</span>
						</button>
					</div>

					<!-- 팝업 목록 -->
					<div class="card">
						<div class="card-header">
							<h5 class="card-title mb-0">팝업 목록</h5>
						</div>
						<table class="table table-hover my-0" id="popupTable">
							<thead>
								<tr>
									<th>이미지</th>
									<th>제목</th>
									<th>표시 순서</th>
									<th>활성 여부</th>
									<th class="d-none d-md-table-cell">등록일</th>
									<th class="text-center">관리</th>
								</tr>
							</thead>
							<tbody>
							</tbody>
						</table>
						<div class="card-footer d-flex justify-content-between align-items-center">
							<span class="text-muted small" id="pageInfo"></span>
							<nav><ul class="pagination pagination-sm mb-0" id="pageNav"></ul></nav>
						</div>
					</div>

				</div>
			</main>

			<footer class="footer">
				<div class="container-fluid">
					<div class="row text-muted">
						<div class="col-12 text-start">
							<p class="mb-0">&copy; Human Clinical</p>
						</div>
					</div>
				</div>
			</footer>
		</div>
	</div>

	<!-- 팝업 등록 모달 -->
	<div class="modal fade" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="createModalLabel">팝업 등록</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<div class="mb-3">
						<label class="form-label" for="createTitle">제목 <span class="text-danger">*</span></label>
						<input type="text" class="form-control" id="createTitle" placeholder="팝업 제목">
						<div class="invalid-feedback">제목을 입력해주세요.</div>
					</div>
					<div class="mb-3">
						<label class="form-label" for="createImage">이미지 <span class="text-danger">*</span></label>
						<input type="file" class="form-control" id="createImage" accept="image/*">
						<div class="invalid-feedback">이미지를 선택해주세요.</div>
						<div class="mt-2" id="createPreviewWrap" style="display:none;">
							<img id="createPreview" src="" alt="미리보기" style="max-width:100%;max-height:200px;border-radius:4px;">
						</div>
					</div>
					<div class="mb-3">
						<label class="form-label" for="createLinkUrl">클릭 링크 URL</label>
						<input type="text" class="form-control" id="createLinkUrl" placeholder="https://example.com (없으면 비워두세요)">
					</div>
					<div class="row">
						<div class="col-6 mb-3">
							<label class="form-label" for="createOrder">표시 순서</label>
							<input type="number" class="form-control" id="createOrder" value="0" min="0">
						</div>
						<div class="col-6 mb-3">
							<label class="form-label" for="createActive">활성 여부</label>
							<select class="form-select" id="createActive">
								<option value="1">활성</option>
								<option value="0">비활성</option>
							</select>
						</div>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
					<button type="button" class="btn btn-primary" id="btnCreate">등록</button>
				</div>
			</div>
		</div>
	</div>

	<!-- 팝업 수정 모달 -->
	<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="editModalLabel">팝업 수정</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<input type="hidden" id="editId">
					<div class="mb-3">
						<label class="form-label" for="editTitle">제목 <span class="text-danger">*</span></label>
						<input type="text" class="form-control" id="editTitle">
						<div class="invalid-feedback">제목을 입력해주세요.</div>
					</div>
					<div class="mb-3">
						<label class="form-label">현재 이미지</label>
						<div class="mb-2">
							<img id="editCurrentImg" src="" alt="현재 이미지" style="max-width:100%;max-height:200px;border-radius:4px;">
						</div>
						<label class="form-label" for="editImage">이미지 변경</label>
						<input type="file" class="form-control" id="editImage" accept="image/*">
						<div class="form-text">변경하려면 새 이미지를 선택하세요.</div>
						<div class="mt-2" id="editPreviewWrap" style="display:none;">
							<img id="editPreview" src="" alt="새 이미지 미리보기" style="max-width:100%;max-height:200px;border-radius:4px;">
						</div>
					</div>
					<div class="mb-3">
						<label class="form-label" for="editLinkUrl">클릭 링크 URL</label>
						<input type="text" class="form-control" id="editLinkUrl" placeholder="https://example.com (없으면 비워두세요)">
					</div>
					<div class="row">
						<div class="col-6 mb-3">
							<label class="form-label" for="editOrder">표시 순서</label>
							<input type="number" class="form-control" id="editOrder" min="0">
						</div>
						<div class="col-6 mb-3">
							<label class="form-label" for="editActive">활성 여부</label>
							<select class="form-select" id="editActive">
								<option value="1">활성</option>
								<option value="0">비활성</option>
							</select>
						</div>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
					<button type="button" class="btn btn-primary" id="btnSaveEdit">저장</button>
				</div>
			</div>
		</div>
	</div>

	<!-- 삭제 확인 모달 -->
	<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-sm">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title" id="deleteModalLabel">팝업 삭제</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<input type="hidden" id="deleteId">
					<p><strong id="deleteTitle"></strong> 팝업을 삭제하시겠습니까?</p>
					<p class="text-danger small mb-0">이 작업은 되돌릴 수 없습니다.</p>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
					<button type="button" class="btn btn-danger" id="btnConfirmDelete">삭제</button>
				</div>
			</div>
		</div>
	</div>

	<!-- 이미지 라이트박스 모달 -->
	<div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog" style="max-width:720px;">
			<div class="modal-content" style="background:transparent;border:none;box-shadow:none;">
				<div class="modal-header" style="border:none;padding:0 0 0.5rem 0;">
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
						style="filter:invert(1);opacity:0.8;"></button>
				</div>
				<div class="modal-body text-center p-0">
					<img id="lightboxImg" src="" alt="팝업 이미지"
						style="max-width:100%;max-height:75vh;border-radius:8px;">
				</div>
			</div>
		</div>
	</div>

	<script src="../js/app.js"></script>
	<script src="../js/pagination.js"></script>
	<script src="../js/admin-utils.js"></script>
	<script src="../js/common.js"></script>
	<script>
		var allPopups = [];
		var NO_IMAGE = "../img/icons/icon-48x48.png";

		// 이미지 미리보기 공통 함수
		function bindImagePreview(inputId, previewId, wrapId) {
			document.getElementById(inputId).addEventListener("change", function () {
				var file = this.files[0];
				var wrap = document.getElementById(wrapId);
				var preview = document.getElementById(previewId);
				if (file && file.type.startsWith("image/")) {
					var reader = new FileReader();
					reader.onload = function (e) {
						preview.src = e.target.result;
						wrap.style.display = "block";
					};
					reader.readAsDataURL(file);
					this.classList.remove("is-invalid");
				} else {
					wrap.style.display = "none";
				}
			});
		}

		// 다음 표시 순서 계산 (마지막 순서 + 1)
		function getNextOrder() {
			var maxOrder = 0;
			allPopups.forEach(function (p) {
				if (p.popupOrder > maxOrder) maxOrder = p.popupOrder;
			});
			return maxOrder + 1;
		}

		// 기존 표시 순서 목록 조회 (excludeId: 수정 시 자기 자신 제외)
		function getExistingOrders(excludeId) {
			var orders = [];
			allPopups.forEach(function (p) {
				if (excludeId && p.id === Number(excludeId)) return;
				if (p.popupOrder > 0) orders.push(p.popupOrder);
			});
			return orders.sort(function (a, b) { return a - b; });
		}

		// 순서 중복 체크 및 확인
		function checkOrderConflict(newOrder, excludeId) {
			if (newOrder <= 0) return true;
			var existingOrders = getExistingOrders(excludeId);
			if (existingOrders.indexOf(newOrder) !== -1) {
				var conflictList = existingOrders.filter(function (o) { return o >= newOrder; });
				var msg = "표시 순서 " + newOrder + "번에 이미 팝업이 있습니다.\n";
				msg += "순서 " + conflictList.join(", ") + "번 팝업이 각각 +1 되어 뒤로 밀립니다.\n\n";
				msg += "계속하시겠습니까?";
				return confirm(msg);
			}
			return true;
		}

		// 활성↔순서 연동
		function bindActiveOrderLink(activeId, orderId) {
			var activeEl = document.getElementById(activeId);
			var orderEl = document.getElementById(orderId);
			activeEl.addEventListener("change", function () {
				if (this.value === "0") {
					orderEl.value = 0;
					orderEl.disabled = true;
				} else {
					orderEl.disabled = false;
					if (parseInt(orderEl.value) === 0) orderEl.value = "";
					orderEl.focus();
				}
			});
			orderEl.addEventListener("change", function () {
				if (parseInt(this.value) === 0 || this.value === "") {
					this.value = 0;
					activeEl.value = "0";
					orderEl.disabled = true;
				}
			});
		}

		// S3 Presigned URL 이미지 업로드
		function uploadPopupImage(file, entityId) {
			return fetch("/api/files/upload-link", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify({
					entityType: "POPUP",
					entityId: entityId,
					fileCategory: "BASIC",
					originalFilename: file.name,
					mimeType: file.type,
					fileSize: file.size
				})
			})
			.then(function (res) {
				if (!res.ok) throw new Error("upload-link 요청 실패");
				return res.json();
			})
			.then(function (data) {
				return fetch(data.uploadUrl, {
					method: "PUT",
					headers: { "Content-Type": file.type },
					body: file
				}).then(function () {
					return data.id;
				});
			});
		}

		// 팝업 목록 로드
		function loadPopups() {
			fetch("/api/popups/all")
				.then(function (res) { return res.json(); })
				.then(function (data) {
					allPopups = data || [];
					renderTable();
				})
				.catch(function () {
					console.error("팝업 목록 로드 실패");
				});
		}

		// 테이블 렌더링
		function renderTable() {
			var tbody = document.querySelector("#popupTable tbody");
			if (!allPopups.length) {
				tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">등록된 팝업이 없습니다.</td></tr>';
				initPagination({ tableId: "popupTable", perPage: 10, infoId: "pageInfo", navId: "pageNav" });
				return;
			}

			var html = "";
			allPopups.forEach(function (p) {
				var imgSrc = p.imageUrl || NO_IMAGE;
				var activeBadge = p.isActive
					? '<span class="badge bg-success">활성</span>'
					: '<span class="badge bg-warning text-dark">비활성</span>';

				html += '<tr>' +
					'<td>' +
						'<img src="' + imgSrc + '" alt="' + (p.title || '') + '" ' +
						'style="width:80px;height:50px;object-fit:cover;border-radius:4px;cursor:pointer;" ' +
						'data-bs-toggle="modal" data-bs-target="#lightboxModal">' +
					'</td>' +
					'<td>' + (p.title || '') + '</td>' +
					'<td><span class="badge bg-secondary">' + (p.popupOrder || 0) + '</span></td>' +
					'<td>' + activeBadge + '</td>' +
					'<td class="d-none d-md-table-cell">' + AdminUtils.formatDate(p.createdAt) + '</td>' +
					'<td class="text-center">' +
						'<button class="btn btn-sm btn-outline-primary me-1 btn-edit" ' +
							'data-bs-toggle="modal" data-bs-target="#editModal" ' +
							'data-id="' + p.id + '" data-title="' + (p.title || '').replace(/"/g, '&quot;') + '" ' +
							'data-order="' + (p.popupOrder || 0) + '" data-active="' + (p.isActive ? '1' : '0') + '" ' +
							'data-link-url="' + (p.linkUrl || '').replace(/"/g, '&quot;') + '" ' +
							'data-img="' + imgSrc + '">' +
							'<i class="align-middle" data-feather="edit-2" style="width:14px;height:14px;"></i>' +
						'</button>' +
						'<button class="btn btn-sm btn-outline-danger btn-delete" ' +
							'data-bs-toggle="modal" data-bs-target="#deleteModal" ' +
							'data-id="' + p.id + '" data-title="' + (p.title || '').replace(/"/g, '&quot;') + '">' +
							'<i class="align-middle" data-feather="trash-2" style="width:14px;height:14px;"></i>' +
						'</button>' +
					'</td>' +
				'</tr>';
			});

			tbody.innerHTML = html;
			if (window.feather) feather.replace();
			initPagination({ tableId: "popupTable", perPage: 10, infoId: "pageInfo", navId: "pageNav" });
		}

		document.addEventListener("DOMContentLoaded", function () {
			// 데이터 로드
			loadPopups();

			// 이미지 미리보기 바인딩
			bindImagePreview("createImage", "createPreview", "createPreviewWrap");
			bindImagePreview("editImage", "editPreview", "editPreviewWrap");

			// 라이트박스 모달
			document.getElementById("lightboxModal").addEventListener("show.bs.modal", function (e) {
				var trigger = e.relatedTarget;
				if (trigger && trigger.tagName === "IMG") {
					document.getElementById("lightboxImg").src = trigger.src;
				}
			});

			// 등록 모달: 활성↔순서 연동
			bindActiveOrderLink("createActive", "createOrder");

			// 등록 모달 열릴 때 초기화
			document.getElementById("createModal").addEventListener("show.bs.modal", function () {
				document.getElementById("createTitle").value = "";
				document.getElementById("createImage").value = "";
				document.getElementById("createPreviewWrap").style.display = "none";
				document.getElementById("createOrder").value = getNextOrder();
				document.getElementById("createOrder").disabled = false;
				document.getElementById("createActive").value = "1";
				document.getElementById("createTitle").classList.remove("is-invalid");
				document.getElementById("createImage").classList.remove("is-invalid");
				document.getElementById("createLinkUrl").value = "";
			});

			// 등록
			document.getElementById("btnCreate").addEventListener("click", function () {
				var btn = this;
				var titleInput = document.getElementById("createTitle");
				var imageInput = document.getElementById("createImage");
				var orderInput = document.getElementById("createOrder");
				var activeInput = document.getElementById("createActive");
				var valid = true;

				if (!titleInput.value.trim()) { titleInput.classList.add("is-invalid"); valid = false; }
				else { titleInput.classList.remove("is-invalid"); }

				if (!imageInput.files.length) { imageInput.classList.add("is-invalid"); valid = false; }
				else { imageInput.classList.remove("is-invalid"); }

				if (!valid) return;

				var newOrder = parseInt(orderInput.value) || 0;
				if (!checkOrderConflict(newOrder, null)) return;

				btn.disabled = true;
				btn.textContent = "등록 중...";

				// 1. 팝업 메타데이터 저장
				fetch("/api/popups", {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({
						title: titleInput.value.trim(),
						popupOrder: newOrder,
						isActive: activeInput.value === "1",
						linkUrl: document.getElementById("createLinkUrl").value.trim() || null
					})
				})
				.then(function (res) {
					if (!res.ok) throw new Error("팝업 등록 실패");
					return res.json();
				})
				.then(function (saved) {
					// 2. 이미지 업로드
					return uploadPopupImage(imageInput.files[0], saved.id);
				})
				.then(function () {
					document.querySelector('#createModal [data-bs-dismiss="modal"]').click();
					loadPopups();
				})
				.catch(function (err) {
					alert("팝업 등록 중 오류가 발생했습니다: " + err.message);
				})
				.finally(function () {
					btn.disabled = false;
					btn.textContent = "등록";
				});
			});

			// 입력 시 에러 초기화 (등록)
			document.getElementById("createTitle").addEventListener("input", function () {
				this.classList.remove("is-invalid");
			});

			// 수정 모달: 활성↔순서 연동
			bindActiveOrderLink("editActive", "editOrder");

			// 수정 모달 열릴 때 데이터 세팅
			document.getElementById("editModal").addEventListener("show.bs.modal", function (e) {
				var btn = e.relatedTarget;
				document.getElementById("editId").value = btn.dataset.id;
				document.getElementById("editTitle").value = btn.dataset.title;
				document.getElementById("editOrder").value = btn.dataset.order;
				document.getElementById("editActive").value = btn.dataset.active;
				document.getElementById("editCurrentImg").src = btn.dataset.img;
				var orderEl = document.getElementById("editOrder");
				orderEl.disabled = btn.dataset.active === "0";
				document.getElementById("editPreviewWrap").style.display = "none";
				document.getElementById("editImage").value = "";
				document.getElementById("editTitle").classList.remove("is-invalid");
				document.getElementById("editLinkUrl").value = btn.dataset.linkUrl || "";
			});

			// 수정 저장
			document.getElementById("btnSaveEdit").addEventListener("click", function () {
				var btn = this;
				var titleInput = document.getElementById("editTitle");
				var orderInput = document.getElementById("editOrder");
				var activeInput = document.getElementById("editActive");
				var imageInput = document.getElementById("editImage");
				var editId = document.getElementById("editId").value;

				if (!titleInput.value.trim()) {
					titleInput.classList.add("is-invalid");
					return;
				}
				titleInput.classList.remove("is-invalid");

				var newOrder = parseInt(orderInput.value) || 0;
				if (!checkOrderConflict(newOrder, editId)) return;

				btn.disabled = true;
				btn.textContent = "저장 중...";

				// 1. 팝업 메타데이터 수정
				fetch("/api/popups/" + editId, {
					method: "PUT",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({
						title: titleInput.value.trim(),
						popupOrder: newOrder,
						isActive: activeInput.value === "1",
						linkUrl: document.getElementById("editLinkUrl").value.trim() || null
					})
				})
				.then(function (res) {
					if (!res.ok) throw new Error("팝업 수정 실패");
					return res.json();
				})
				.then(function (saved) {
					// 2. 새 이미지가 있으면 업로드
					if (imageInput.files.length) {
						return uploadPopupImage(imageInput.files[0], saved.id);
					}
				})
				.then(function () {
					document.querySelector('#editModal [data-bs-dismiss="modal"]').click();
					loadPopups();
				})
				.catch(function (err) {
					alert("팝업 수정 중 오류가 발생했습니다: " + err.message);
				})
				.finally(function () {
					btn.disabled = false;
					btn.textContent = "저장";
				});
			});

			// 수정 입력 시 에러 초기화
			document.getElementById("editTitle").addEventListener("input", function () {
				this.classList.remove("is-invalid");
			});

			// 삭제 모달 열릴 때 데이터 세팅
			document.getElementById("deleteModal").addEventListener("show.bs.modal", function (e) {
				var btn = e.relatedTarget;
				document.getElementById("deleteId").value = btn.dataset.id;
				document.getElementById("deleteTitle").textContent = btn.dataset.title;
			});

			// 삭제 확인
			document.getElementById("btnConfirmDelete").addEventListener("click", function () {
				var btn = this;
				var deleteId = document.getElementById("deleteId").value;

				btn.disabled = true;
				btn.textContent = "삭제 중...";

				fetch("/api/popups/" + deleteId, { method: "DELETE" })
					.then(function (res) {
						if (!res.ok) throw new Error("팝업 삭제 실패");
						document.querySelector('#deleteModal [data-bs-dismiss="modal"]').click();
						loadPopups();
					})
					.catch(function (err) {
						alert("팝업 삭제 중 오류가 발생했습니다: " + err.message);
					})
					.finally(function () {
						btn.disabled = false;
						btn.textContent = "삭제";
					});
			});
		});
	</script>
</body>

</html>
