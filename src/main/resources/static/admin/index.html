<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link rel="shortcut icon" href="img/icons/icon-48x48.png" />

	<title>대시보드 - Human Clinical 관리자</title>

	<link href="css/app.css" rel="stylesheet">
	<link href="css/custom.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body data-page="index">
	<div class="wrapper">

		<div id="sidebar-container"></div>

		<div class="main">
			<div id="header-container"></div>

			<main class="content">
				<div class="container-fluid p-0">

					<h1 class="h3 mb-3"><strong>대시보드</strong></h1>

					<!-- 통계 카드 -->
					<div class="row">
						<div class="col-sm-6 col-xl-3">
							<div class="card">
								<div class="card-body">
									<div class="row">
										<div class="col mt-0">
											<h5 class="card-title">전체 회원</h5>
										</div>
										<div class="col-auto">
											<div class="stat text-primary">
												<i class="align-middle" data-feather="users"></i>
											</div>
										</div>
									</div>
									<h1 class="mt-1 mb-3" id="statTotalMembers">-</h1>
									<div class="mb-0">
										<span class="text-muted">등록된 전체 회원</span>
									</div>
								</div>
							</div>
						</div>
						<div class="col-sm-6 col-xl-3">
							<div class="card">
								<div class="card-body">
									<div class="row">
										<div class="col mt-0">
											<h5 class="card-title">IRB 심의중</h5>
										</div>
										<div class="col-auto">
											<div class="stat text-warning">
												<i class="align-middle" data-feather="shield"></i>
											</div>
										</div>
									</div>
									<h1 class="mt-1 mb-3" id="statIrbUnderReview">-</h1>
									<div class="mb-0">
										<span class="text-muted">진행 중인 심의</span>
									</div>
								</div>
							</div>
						</div>
						<div class="col-sm-6 col-xl-3">
							<div class="card">
								<div class="card-body">
									<div class="row">
										<div class="col mt-0">
											<h5 class="card-title">모집중 공고</h5>
										</div>
										<div class="col-auto">
											<div class="stat text-success">
												<i class="align-middle" data-feather="clipboard"></i>
											</div>
										</div>
									</div>
									<h1 class="mt-1 mb-3" id="statActiveRecruitments">-</h1>
									<div class="mb-0">
										<span class="badge bg-info me-1" id="statPermanentlyOpen">0</span>
										<span class="text-muted">상시모집 포함</span>
									</div>
								</div>
							</div>
						</div>
						<div class="col-sm-6 col-xl-3">
							<div class="card">
								<div class="card-body">
									<div class="row">
										<div class="col mt-0">
											<h5 class="card-title">미답변 문의</h5>
										</div>
										<div class="col-auto">
											<div class="stat text-danger">
												<i class="align-middle" data-feather="help-circle"></i>
											</div>
										</div>
									</div>
									<h1 class="mt-1 mb-3" id="statUnansweredInquiries">-</h1>
									<div class="mb-0">
										<span class="text-muted">답변 대기중</span>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- 누적 데이터 -->
					<div class="row">
						<div class="col-12">
							<div class="card">
								<div class="card-header d-flex justify-content-between align-items-center">
									<h5 class="card-title mb-0">누적 데이터</h5>
									<a href="cumulative-data/list.html" class="btn btn-sm btn-outline-secondary">관리</a>
								</div>
								<div class="card-body">
									<div class="row text-center" id="cumulativeDataRow">
										<div class="col">
											<p class="text-muted mb-0">데이터를 불러오는 중...</p>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<!-- 최근 활동 -->
					<div class="row">
						<!-- 최근 IRB 심의 -->
						<div class="col-xl-6">
							<div class="card">
								<div class="card-header d-flex justify-content-between align-items-center">
									<h5 class="card-title mb-0">최근 IRB 심의</h5>
									<a href="e-irb/list.html" class="btn btn-sm btn-outline-secondary">전체보기</a>
								</div>
								<table class="table table-hover my-0">
									<thead>
										<tr>
											<th>제목</th>
											<th style="width:80px;">구분</th>
											<th style="width:80px;">상태</th>
											<th style="width:100px;">등록일</th>
										</tr>
									</thead>
									<tbody id="recentIrbsBody">
										<tr><td colspan="4" class="text-center text-muted py-3">불러오는 중...</td></tr>
									</tbody>
								</table>
							</div>
						</div>

						<!-- 최근 피험자 신청 -->
						<div class="col-xl-6">
							<div class="card">
								<div class="card-header d-flex justify-content-between align-items-center">
									<h5 class="card-title mb-0">최근 피험자 신청</h5>
									<a href="trial-application/list.html" class="btn btn-sm btn-outline-secondary">전체보기</a>
								</div>
								<table class="table table-hover my-0">
									<thead>
										<tr>
											<th>신청자</th>
											<th>시험명</th>
											<th style="width:80px;">상태</th>
											<th style="width:100px;">신청일</th>
										</tr>
									</thead>
									<tbody id="recentApplicationsBody">
										<tr><td colspan="4" class="text-center text-muted py-3">불러오는 중...</td></tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>

					<!-- 최근 문의 & 팝업 -->
					<div class="row">
						<!-- 최근 시험문의 -->
						<div class="col-xl-6">
							<div class="card">
								<div class="card-header d-flex justify-content-between align-items-center">
									<h5 class="card-title mb-0">최근 시험문의</h5>
									<a href="trial-question/list.html" class="btn btn-sm btn-outline-secondary">전체보기</a>
								</div>
								<table class="table table-hover my-0">
									<thead>
										<tr>
											<th>제목</th>
											<th style="width:80px;">상태</th>
											<th style="width:100px;">문의일</th>
										</tr>
									</thead>
									<tbody id="recentInquiriesBody">
										<tr><td colspan="3" class="text-center text-muted py-3">불러오는 중...</td></tr>
									</tbody>
								</table>
							</div>
						</div>

						<!-- 활성 팝업 -->
						<div class="col-xl-6">
							<div class="card">
								<div class="card-header d-flex justify-content-between align-items-center">
									<h5 class="card-title mb-0">활성 팝업</h5>
									<a href="popup/list.html" class="btn btn-sm btn-outline-secondary">전체보기</a>
								</div>
								<table class="table table-hover my-0">
									<thead>
										<tr>
											<th>팝업 제목</th>
											<th style="width:80px;">상태</th>
											<th style="width:80px;">순서</th>
										</tr>
									</thead>
									<tbody id="activePopupsBody">
										<tr><td colspan="3" class="text-center text-muted py-3">불러오는 중...</td></tr>
									</tbody>
								</table>
							</div>
						</div>
					</div>

				</div>
			</main>

			<footer class="footer">
				<div class="container-fluid">
					<div class="row text-muted">
						<div class="col-12 text-start">
							<p class="mb-0">&copy; Human Clinical</p>
						</div>
					</div>
				</div>
			</footer>
		</div>
	</div>

	<script src="js/app.js"></script>
	<script src="js/admin-utils.js"></script>
	<script src="js/common.js"></script>
	<script>
		function formatNumber(n) {
			return n != null ? n.toLocaleString() : "0";
		}

		function formatDateShort(dateStr) {
			if (!dateStr) return "-";
			var d = new Date(dateStr);
			var y = d.getFullYear();
			var m = String(d.getMonth() + 1).padStart(2, "0");
			var day = String(d.getDate()).padStart(2, "0");
			return y + "-" + m + "-" + day;
		}

		function irbStatusBadge(status) {
			if (status === "IN_REVIEW") return '<span class="badge bg-warning text-dark">심의중</span>';
			if (status === "COMPLETED") return '<span class="badge bg-success">심의완료</span>';
			return '<span class="badge bg-secondary">' + (status || "-") + '</span>';
		}

		function appStatusBadge(status) {
			if (status === "PENDING") return '<span class="badge bg-warning text-dark">대기</span>';
			if (status === "APPROVED") return '<span class="badge bg-success">승인</span>';
			if (status === "REJECTED") return '<span class="badge bg-danger">거절</span>';
			return '<span class="badge bg-secondary">' + (status || "-") + '</span>';
		}

		function inquiryStatusBadge(status) {
			if (status === "PENDING") return '<span class="badge bg-danger">미답변</span>';
			if (status === "ANSWERED") return '<span class="badge bg-success">답변완료</span>';
			return '<span class="badge bg-secondary">' + (status || "-") + '</span>';
		}

		function loadDashboard() {
			fetch("/api/dashboard")
				.then(function (res) { return res.json(); })
				.then(function (data) {
					// 통계 카드
					document.getElementById("statTotalMembers").textContent = formatNumber(data.totalMembers);
					document.getElementById("statIrbUnderReview").textContent = formatNumber(data.irbUnderReview);
					document.getElementById("statActiveRecruitments").textContent = formatNumber(data.activeRecruitments);
					document.getElementById("statPermanentlyOpen").textContent = formatNumber(data.permanentlyOpenRecruitments);
					document.getElementById("statUnansweredInquiries").textContent = formatNumber(data.unansweredInquiries);

					// 누적 데이터
					renderCumulativeData(data.cumulativeData);

					// 최근 IRB 심의
					renderRecentIrbs(data.recentIrbs);

					// 최근 피험자 신청
					renderRecentApplications(data.recentApplications);

					// 최근 시험문의
					renderRecentInquiries(data.recentInquiries);

					// 활성 팝업
					renderActivePopups(data.activePopups);
				})
				.catch(function (err) {
					console.error("대시보드 로드 실패:", err);
				});
		}

		function renderCumulativeData(items) {
			var row = document.getElementById("cumulativeDataRow");
			if (!items || items.length === 0) {
				row.innerHTML = '<div class="col"><p class="text-muted mb-0">등록된 누적 데이터가 없습니다.</p></div>';
				return;
			}
			var html = "";
			items.forEach(function (item) {
				html += '<div class="col">';
				html += '<h2 class="mb-1">' + formatNumber(item.dataCount) + '</h2>';
				html += '<p class="text-muted mb-0">' + (item.dataType || "-") + '</p>';
				html += '</div>';
			});
			row.innerHTML = html;
		}

		function renderRecentIrbs(items) {
			var tbody = document.getElementById("recentIrbsBody");
			if (!items || items.length === 0) {
				tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">최근 IRB 심의가 없습니다.</td></tr>';
				return;
			}
			var html = "";
			items.forEach(function (item) {
				html += '<tr style="cursor:pointer;" onclick="location.href=\'e-irb/detail.html?id=' + item.id + '\'">';
				html += '<td>' + (item.title || "-") + '</td>';
				html += '<td><span class="badge bg-info">' + (item.categoryName || "-") + '</span></td>';
				html += '<td>' + irbStatusBadge(item.status) + '</td>';
				html += '<td>' + formatDateShort(item.createdAt) + '</td>';
				html += '</tr>';
			});
			tbody.innerHTML = html;
		}

		function renderRecentApplications(items) {
			var tbody = document.getElementById("recentApplicationsBody");
			if (!items || items.length === 0) {
				tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">최근 피험자 신청이 없습니다.</td></tr>';
				return;
			}
			var html = "";
			items.forEach(function (item) {
				html += '<tr>';
				html += '<td>' + (item.applicantName || "-") + '</td>';
				html += '<td>' + (item.trialName || "-") + '</td>';
				html += '<td>' + appStatusBadge(item.status) + '</td>';
				html += '<td>' + formatDateShort(item.createdAt) + '</td>';
				html += '</tr>';
			});
			tbody.innerHTML = html;
		}

		function renderRecentInquiries(items) {
			var tbody = document.getElementById("recentInquiriesBody");
			if (!items || items.length === 0) {
				tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-3">최근 시험문의가 없습니다.</td></tr>';
				return;
			}
			var html = "";
			items.forEach(function (item) {
				html += '<tr>';
				html += '<td>' + (item.title || "-") + '</td>';
				html += '<td>' + inquiryStatusBadge(item.status) + '</td>';
				html += '<td>' + formatDateShort(item.createdAt) + '</td>';
				html += '</tr>';
			});
			tbody.innerHTML = html;
		}

		function renderActivePopups(items) {
			var tbody = document.getElementById("activePopupsBody");
			if (!items || items.length === 0) {
				tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-3">활성 팝업이 없습니다.</td></tr>';
				return;
			}
			var html = "";
			items.forEach(function (item) {
				html += '<tr>';
				html += '<td>' + (item.title || "-") + '</td>';
				html += '<td><span class="badge bg-success">노출중</span></td>';
				html += '<td><span class="badge bg-secondary">' + (item.popupOrder || 0) + '</span></td>';
				html += '</tr>';
			});
			tbody.innerHTML = html;
		}

		document.addEventListener("DOMContentLoaded", function () {
			loadDashboard();
		});
	</script>
</body>

</html>
