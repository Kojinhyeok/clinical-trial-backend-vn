<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link rel="shortcut icon" href="../img/icons/icon-48x48.png" />

	<title>공지사항 관리 - Human Clinical 관리자</title>

	<link href="../css/app.css" rel="stylesheet">
	<link href="../css/custom.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body data-page="trial-notification-list" data-base="../">
	<div class="wrapper">

		<div id="sidebar-container"></div>

		<div class="main">
			<div id="header-container"></div>

			<main class="content">
				<div class="container-fluid p-0">

					<div class="d-flex justify-content-between align-items-center mb-3">
						<h1 class="h3 mb-0"><strong>공지사항 관리</strong></h1>
						<a href="detail" class="btn btn-primary">
							<i class="align-middle" data-feather="plus"></i>
							<span class="align-middle ms-1">공지사항 등록</span>
						</a>
					</div>

					<!-- 검색 필터 -->
					<div id="searchFilterContainer"></div>

					<!-- 공지사항 목록 -->
					<div class="card">
						<div class="card-header">
							<h5 class="card-title mb-0">공지사항 목록</h5>
						</div>
						<div class="table-responsive">
							<table class="table table-hover my-0" id="notificationTable">
								<thead>
									<tr>
										<th>제목</th>
										<th style="width:70px;">공지</th>
										<th style="width:90px;">상태</th>
										<th class="d-none d-md-table-cell" style="width:100px;">조회수</th>
										<th class="d-none d-md-table-cell" style="width:120px;">등록일</th>
									</tr>
								</thead>
								<tbody>
								</tbody>
							</table>
						</div>
						<div class="card-footer d-flex justify-content-between align-items-center">
							<span class="text-muted small" id="pageInfo"></span>
							<nav><ul class="pagination pagination-sm mb-0" id="pageNav"></ul></nav>
						</div>
					</div>

				</div>
			</main>

			<footer class="footer">
				<div class="container-fluid">
					<div class="row text-muted">
						<div class="col-12 text-start">
							<p class="mb-0">&copy; Human Clinical</p>
						</div>
					</div>
				</div>
			</footer>
		</div>
	</div>

	<script src="../js/app.js"></script>
	<script src="../js/pagination.js"></script>
	<script src="../js/search-filter.js"></script>
	<script src="../js/common.js"></script>
	<script src="../js/admin-utils.js"></script>
	<script>
		function escapeHtml(str) {
			if (!str) return "";
			var div = document.createElement("div");
			div.textContent = str;
			return div.innerHTML;
		}

		function loadNotifications() {
			fetch("/api/notifications")
				.then(function (res) {
					if (!res.ok) throw new Error("API 오류: " + res.status);
					return res.json();
				})
				.then(function (list) {
					renderRows(Array.isArray(list) ? list : []);
				})
				.catch(function (err) {
					console.error("공지사항 목록 로딩 실패:", err);
					document.querySelector("#notificationTable tbody").innerHTML =
						'<tr><td colspan="5" class="text-center text-muted py-4">데이터를 불러올 수 없습니다.</td></tr>';
				});
		}

		function renderRows(items) {
			var tbody = document.querySelector("#notificationTable tbody");
			tbody.innerHTML = "";

			if (items.length === 0) {
				tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">등록된 공지사항이 없습니다.</td></tr>';
				initSearchAndPagination();
				return;
			}

			items.forEach(function (n) {
				var tr = document.createElement("tr");
				tr.style.cursor = "pointer";
				tr.setAttribute("data-status", n.isTemp ? "temp" : "published");
				tr.setAttribute("data-notice", n.isNotification ? "1" : "0");
				tr.setAttribute("data-keyword", (n.title || "") + " " + (n.content || ""));
				tr.addEventListener("click", function () {
					location.href = "detail?id=" + n.id;
				});

				var noticeBadge = n.isNotification
					? '<span class="badge bg-danger me-1">공지</span>'
					: '';

				var noticeCol = n.isNotification
					? '<span class="badge bg-danger">공지</span>'
					: '<span class="badge bg-secondary">일반</span>';

				var statusBadge = n.isTemp
					? '<span class="badge bg-warning text-dark">임시저장</span>'
					: '<span class="badge bg-success">게시</span>';

				tr.innerHTML =
					'<td>' + noticeBadge + escapeHtml(n.title || "제목 없음") + '</td>' +
					'<td>' + noticeCol + '</td>' +
					'<td>' + statusBadge + '</td>' +
					'<td class="d-none d-md-table-cell">' + (n.view || 0) + '</td>' +
					'<td class="d-none d-md-table-cell">' + AdminUtils.formatDate(n.createdAt) + '</td>';

				tbody.appendChild(tr);
			});

			initSearchAndPagination();
		}

		var searchFilterInited = false;
		function initSearchAndPagination() {
			if (!searchFilterInited) {
				initSearchFilter({
					containerId: "searchFilterContainer",
					tableId: "notificationTable",
					pagination: { perPage: 10, infoId: "pageInfo", navId: "pageNav" },
					showReset: true,
					fields: [
						{ type: "select", id: "searchStatus", label: "상태", colClass: "col-md-2", dataKey: "status",
							options: [{ value: "published", text: "게시" }, { value: "temp", text: "임시저장" }] },
						{ type: "select", id: "searchNotice", label: "공지 여부", colClass: "col-md-2", dataKey: "notice",
							options: [{ value: "1", text: "공지" }, { value: "0", text: "일반" }] },
						{ type: "text", id: "searchKeyword", label: "제목/내용 검색", placeholder: "키워드 검색", colClass: "col-md-3", dataKey: "keyword" }
					]
				});
				searchFilterInited = true;
			} else {
				if (typeof initPagination === "function") {
					initPagination({ tableId: "notificationTable", perPage: 10, infoId: "pageInfo", navId: "pageNav" });
				}
			}
		}

		document.addEventListener("DOMContentLoaded", function () {
			loadNotifications();
		});
	</script>
</body>

</html>
