spring:
    application:
        name: clinical-trial-backend-vn
    datasource:
        url: jdbc:mysql://clinical-trial-vn-db.cfe46ucsu7eo.ap-northeast-2.rds.amazonaws.com:3306/clinical_trial_vn
        username: admin
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
        database-platform: org.hibernate.dialect.MySQLDialect
    cloud:
        aws:
            credentials:
                access-key: ${AWS_ACCESS_KEY}
                secret-key: ${AWS_SECRET_KEY}
            region:
                static: ap-northeast-2
            s3:
                bucket: ${AWS_S3_BUCKET_NAME}
    mail:
        host: email-smtp.ap-northeast-2.amazonaws.com
        port: 587
        username: ${SES_SMTP_USERNAME}
        password: ${SES_SMTP_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                        required: true
                    timeout: 5000
                    connectiontimeout: 5000
                    writetimeout: 5000

server:
    port: 8080

email:
    provider: smtp
    from: noreply@humantest.co.kr
    base-url: https://13.125.41.8